name: Build & Deploy Blog

on:
  repository_dispatch:
    types: [contentful-publish]
  schedule:
    # Fallback: alle 30 Minuten neu bauen, falls der Contentful-Webhook ausfällt
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'build-blog.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build blog
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: node build-blog.js

      - name: FTP Deploy blog
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}blog/
          local-dir: ./_blog-dist/
