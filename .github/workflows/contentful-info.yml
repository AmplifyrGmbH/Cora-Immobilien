name: Contentful Space Info (temporär)

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Space-Metadaten abfragen
        env:
          SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          echo "--- Space, aus dem gebaut wird ---"
          curl -s "https://cdn.contentful.com/spaces/$SPACE_ID?access_token=$TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Space-Name:', d.get('name'))"

          echo "--- Environments ---"
          curl -s "https://cdn.contentful.com/spaces/$SPACE_ID/environments?access_token=$TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Environments:', [e['sys']['id'] for e in d.get('items',[])])"

          echo "--- Publizierte immoblog-Eintraege (master) ---"
          curl -s "https://cdn.contentful.com/spaces/$SPACE_ID/environments/master/entries?access_token=$TOKEN&content_type=immoblog&select=fields.slug,sys.updatedAt" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('Anzahl:', d.get('total'))
for e in d.get('items',[]):
    print(' -', e['fields'].get('slug'), '| zuletzt publiziert:', e['sys']['updatedAt'])
"
